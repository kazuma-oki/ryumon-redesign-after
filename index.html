<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc><template>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f5efe6;color:#2b1d1a;font-family:'Zen Kaku Gothic New',sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#651d26;text-decoration:none}
a:hover{color:#3a1016}
button,input,select,textarea{font-family:inherit}
h1,h2,h3,h4,p,figcaption{word-break:auto-phrase}
h1,h2,h3,h4{text-wrap:balance}
p,dd,li{text-wrap:pretty}
@media (max-width:759px){input,select,textarea{font-size:16px!important}}
@keyframes kb{from{transform:scale(1.12)}to{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
</style>
</helmet>

<div style="min-height:100vh;display:flex;flex-direction:column">

<div style="background:#1b0b0e;color:#d9c3a0;font-size:11px;letter-spacing:.06em;text-align:center;padding:6px 12px">デザイン確認用のデモです（予約・送信・購入は行われません）</div>

<header style="position:sticky;top:0;z-index:50;background:rgba(245,239,230,.94);backdrop-filter:blur(10px);border-bottom:1px solid #e2d8c9">
  <div style="max-width:1320px;margin:0 auto;padding:0 clamp(20px,5vw,56px);height:{{ headH }};display:flex;align-items:center;gap:{{ headGap }}">
    <a href="#" onClick="{{ go.top }}" style="display:flex;align-items:center;gap:12px;color:#2b1d1a;margin-right:auto;white-space:nowrap;flex:none">
      <span style="width:40px;height:40px;border:1px solid #651d26;color:#651d26;display:grid;place-items:center;font-family:'Shippori Mincho',serif;font-size:14px;line-height:1.05;text-align:center">龍<br>門</span>
      <span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:10px;letter-spacing:.3em;color:#6b5a52">韓国占い</span><span style="font-family:'Shippori Mincho',serif;font-size:22px;letter-spacing:.14em;font-weight:500">龍門精舎</span></span>
    </a>
    <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
      <nav style="display:flex;align-items:center;gap:26px">
        <sc-for list="{{ nav }}" as="item" hint-placeholder-count="6">
          <a href="#" onClick="{{ item.go }}" style="position:relative;font-size:14px;color:#2b1d1a;padding:6px 0;display:flex;align-items:center;gap:6px;white-space:nowrap;flex:none" style-hover="color:#651d26">
            {{ item.label }}
            <sc-if value="{{ item.active }}"><span style="position:absolute;left:0;right:0;bottom:-2px;height:1px;background:#651d26"></span></sc-if>
          </a>
        </sc-for>
      </nav>
    </sc-if>
    <button onClick="{{ toggleCart }}" style="position:relative;background:none;border:1px solid #d6c9b5;height:44px;padding:0 14px;cursor:pointer;color:#2b1d1a;font-size:13px;display:flex;align-items:center;gap:8px;white-space:nowrap;flex:none" style-hover="border-color:#651d26">
      カート<span style="min-width:20px;height:20px;border-radius:10px;background:#651d26;color:#fff;font-size:11px;display:grid;place-items:center;padding:0 6px">{{ cartCount }}</span>
    </button>
    <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
      <a href="#" onClick="{{ go.contact }}" style="background:#651d26;color:#fff;height:44px;padding:0 22px;display:flex;align-items:center;gap:14px;font-size:14px;letter-spacing:.06em;white-space:nowrap;flex:none" style-hover="background:#3a1016;color:#fff">ご予約・ご相談</a>
    </sc-if>
    <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ toggleMenu }}" aria-label="{{ menuLabel }}" style="position:relative;width:48px;height:44px;background:#651d26;border:0;cursor:pointer;flex:none">
        <span style="position:absolute;left:14px;right:14px;height:1.5px;background:#fff;top:{{ hb.t1 }};transform:{{ hb.r1 }};transition:all .25s"></span>
        <span style="position:absolute;left:14px;right:14px;height:1.5px;background:#fff;top:21px;opacity:{{ hb.o }};transition:opacity .2s"></span>
        <span style="position:absolute;left:14px;right:14px;height:1.5px;background:#fff;top:{{ hb.t3 }};transform:{{ hb.r3 }};transition:all .25s"></span>
      </button>
    </sc-if>
  </div>
  <sc-if value="{{ menuOpen }}">
    <div style="border-top:1px solid #e2d8c9;background:#f5efe6;padding:8px clamp(20px,5vw,56px) 24px;display:flex;flex-direction:column">
      <sc-for list="{{ nav }}" as="item">
        <a href="#" onClick="{{ item.go }}" style="padding:16px 0;border-bottom:1px solid #e2d8c9;color:#2b1d1a;font-size:16px;display:flex;justify-content:space-between;white-space:nowrap;flex:none">{{ item.label }}</a>
      </sc-for>
      <a href="us/" style="padding:16px 0;border-bottom:1px solid #e2d8c9;color:#2b1d1a;font-size:16px;display:flex;white-space:nowrap;flex:none">米国にお住まいの方へ</a>
      <a href="#" onClick="{{ go.contact }}" style="margin-top:20px;background:#651d26;color:#fff;padding:18px 22px;display:flex;justify-content:space-between;font-size:15px;white-space:nowrap;flex:none">ご予約・ご相談</a>
    </div>
  </sc-if>
</header>

<main style="flex:1">

<!-- ================= TOP ================= -->
<sc-if value="{{ is.top }}" hint-placeholder-val="{{ true }}">

<section data-screen-label="01 FV" style="position:relative;min-height:max(680px, calc(100svh - 106px));background:#1b0b0e;color:#f3ece0;overflow:hidden;display:flex;flex-direction:column">
  <div style="position:absolute;top:0;right:0;bottom:0;width:{{ heroImgW }};overflow:hidden">
    <sc-for list="{{ slides }}" as="s" hint-placeholder-count="0">
      <img src="{{ s.src }}" alt="{{ s.alt }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:{{ s.pos }};display:block;opacity:{{ s.op }};transform:{{ s.tf }};transition:opacity 1.6s ease, transform 8s linear">
    </sc-for>
  </div>
  <div style="position:absolute;inset:0;background:{{ heroOverlay }}"></div>
  <sc-if value="{{ heroCaption }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;top:0;right:0;bottom:0;width:{{ heroImgW }};pointer-events:none">
      <div style="position:absolute;right:clamp(8px,3%,40px);top:clamp(32px,6vh,64px);writing-mode:vertical-rl;font-family:'Shippori Mincho',serif;font-size:13px;letter-spacing:.2em;color:#f3ece0;display:flex;gap:16px;align-items:center;animation:fadein 2s 1s both;background:rgba(27,11,14,.72);backdrop-filter:blur(4px);padding:20px 12px">
        <span style="height:48px;width:1px;background:#b8925a"></span>祈りを受け継ぎ、一人ひとりと向き合う。<span style="color:#d4b07c">鄭 東秀</span>
      </div>
    </div>
  </sc-if>
  <div style="position:absolute;left:-3vw;bottom:-14vw;font-family:'Shippori Mincho',serif;font-size:min(52vw,640px);line-height:1;color:rgba(184,146,90,.07);pointer-events:none;user-select:none">龍</div>

  <div style="position:relative;flex:1;max-width:1320px;width:100%;margin:0 auto;padding:clamp(40px,7vh,96px) clamp(20px,5vw,56px) 40px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:32px">
    <div style="display:flex;flex-direction:column;gap:14px;animation:rise 1.2s both"><div style="font-family:'Shippori Mincho',serif;font-size:15px;letter-spacing:.3em;color:#d4b07c">용문정사　韓国占い 龍門精舎</div></div>
    <h1 style="margin:0;text-align:left;font-family:'Shippori Mincho',serif;font-weight:500;font-size:clamp(32px,4.2vw,60px);letter-spacing:.08em;line-height:1.6;color:#f8f2e8;animation:rise 1.2s .2s both;text-shadow:0 2px 30px rgba(0,0,0,.4)">心を見つめ、<br>これからを考える。</h1>
    <div style="display:flex;flex-direction:column;gap:28px;max-width:420px;animation:rise 1.2s .5s both">
      <p style="margin:0;font-size:15px;line-height:2.1;color:#eadfcd">恋愛、仕事、家族、これからの暮らし。<br>一人ひとりの悩みに向き合い、<br>歩みを進めるためのご相談を承ります。</p>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px">
        <a href="#" onClick="{{ go.services }}" style="background:#b8925a;color:#1b0b0e;padding:17px 26px;font-size:14px;font-weight:500;letter-spacing:.06em;display:flex;gap:18px;align-items:center;justify-content:space-between;white-space:nowrap;flex:none" style-hover="background:#d4b07c;color:#1b0b0e">鑑定と料金を見る</a>
        <a href="#" onClick="{{ go.contact }}" style="border:1px solid rgba(243,236,224,.5);color:#f3ece0;padding:17px 26px;font-size:14px;letter-spacing:.06em;display:flex;gap:18px;align-items:center;justify-content:space-between;white-space:nowrap;flex:none" style-hover="background:rgba(243,236,224,.1);color:#fff">予約について相談する</a>
      </div>
      <div style="display:flex;gap:24px;flex-wrap:wrap;font-size:12px;color:#c9b8a0;letter-spacing:.06em">
        <span>鑑定 15分 3,300円〜</span><span>新宿本店 / 新大久保イケメン通り店</span>
      </div>
      <div style="display:flex;align-items:center;gap:14px">
        <span style="font-family:'Shippori Mincho',serif;font-size:13px;color:#d4b07c;min-width:52px">{{ slideNo }}</span>
        <div style="display:flex;gap:6px">
          <sc-for list="{{ slides }}" as="s" hint-placeholder-count="6">
            <button onClick="{{ s.pick }}" aria-label="{{ s.label }}" style="width:28px;height:24px;background:none;border:0;padding:0;cursor:pointer;display:flex;align-items:center"><span style="display:block;width:100%;height:2px;background:{{ s.bar }};transition:background .4s"></span></button>
          </sc-for>
        </div>
      </div>
    </div>
  </div>

  <div style="position:relative;border-top:1px solid rgba(184,146,90,.35);background:rgba(27,11,14,.72);backdrop-filter:blur(8px);animation:fadein 1.4s .9s both">
    <div style="max-width:1320px;margin:0 auto;padding:0 clamp(20px,5vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">
      <div style="padding:22px 20px 22px 0;display:flex;flex-direction:column;justify-content:center;gap:4px">
        <span style="font-family:'Shippori Mincho',serif;font-size:15px">今気になっていることは？</span>
      </div>
      <sc-for list="{{ concerns }}" as="c" hint-placeholder-count="4">
        <a href="#" onClick="{{ go.services }}" style="padding:22px 20px;border-left:1px solid rgba(184,146,90,.25);color:#f3ece0;display:flex;align-items:center;gap:14px;white-space:nowrap;flex:none" style-hover="background:rgba(184,146,90,.12);color:#fff">
          <span style="font-size:15px;flex:1">{{ c.title }}</span>
        </a>
      </sc-for>
    </div>
  </div>
</section>

<section style="max-width:1320px;margin:0 auto;padding:clamp(64px,9vw,128px) clamp(20px,5vw,56px);display:flex;gap:clamp(40px,6vw,96px);align-items:flex-start;flex-wrap:wrap">
  <figure style="margin:0;flex:1 1 340px;max-width:480px;position:relative">
    <img src="uploads/pasted-1792501164687-0.png" alt="祭壇の前で手を合わせて祈る女性" style="width:100%;aspect-ratio:4/5;object-fit:cover;object-position:30% center;display:block">
    <figcaption style="position:absolute;right:-18px;top:24px;writing-mode:vertical-rl;background:#651d26;padding:18px 10px;font-family:'Shippori Mincho',serif;font-size:13px;letter-spacing:.3em;color:#f3ece0;box-shadow:0 8px 24px rgba(43,29,26,.25)">祈りの場に、そっと灯る色。</figcaption>
  </figure>
  <div style="flex:1 1 380px;display:flex;flex-direction:column;gap:28px;align-self:stretch">
    <div style="display:flex;align-items:center;gap:12px;font-family:'Shippori Mincho',serif;font-size:13px;letter-spacing:.16em;color:#651d26"><span style="width:24px;height:1px;background:#b8925a"></span>龍門精舎について</div>
    <h2 style="margin:0;font-family:'Shippori Mincho',serif;font-weight:500;font-size:clamp(26px,3.2vw,38px);line-height:1.6;letter-spacing:.06em">祈りの伝統を受け継ぎ、<br>一人ひとりと向き合う。</h2>
    <div style="display:flex;flex-direction:column;gap:20px">
    <p style="margin:0;font-size:15px;line-height:2.1;color:#4a3b35">大切にしているのは、ご自身を見つめ、<br>これからの選択を考えるお手伝いをすること。</p>
    <p style="margin:0;font-size:15px;line-height:2.1;color:#4a3b35">龍門精舎は、韓国の祈りの伝統を背景に、占いや祈祷を通じた相談を行っています。初めての方にも、鑑定や祈祷の内容をご案内します。</p>
    </div>
    <a href="#" onClick="{{ go.about }}" style="align-self:flex-start;margin-top:auto;border-bottom:1px solid #651d26;padding:10px 0;font-size:14px;display:flex;gap:28px;white-space:nowrap;flex:none">龍門精舎について</a>
  </div>
</section>

<section style="background:#fbf8f2;border-top:1px solid #e2d8c9;border-bottom:1px solid #e2d8c9">
  <div style="max-width:1320px;margin:0 auto;padding:clamp(56px,8vw,112px) clamp(20px,5vw,56px);display:flex;flex-direction:column;gap:40px">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap">
      <div style="display:flex;flex-direction:column;gap:20px">
        <div style="display:flex;align-items:center;gap:12px;font-family:'Shippori Mincho',serif;font-size:13px;letter-spacing:.16em;color:#651d26"><span style="width:24px;height:1px;background:#b8925a"></span>鑑定と料金</div>
        <h2 style="margin:0;font-family:'Shippori Mincho',serif;font-weight:500;font-size:clamp(26px,3.2vw,38px);line-height:1.6;letter-spacing:.06em">ご相談に合わせて、<br>鑑定をお選びください。</h2>
      </div>
      <p style="margin:0;max-width:400px;font-size:14px;line-height:2;color:#4a3b35">内容と料金を確かめて、安心して相談を。迷われる場合は、ご希望を伺ってからご案内します。</p>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1px;background:#e2d8c9;border:1px solid #e2d8c9">
      <sc-for list="{{ feesTop }}" as="f" hint-placeholder-count="4">
        <div style="background:#fbf8f2;display:flex;flex-direction:{{ feeDir }}">
          <sc-if value="{{ f.img }}"><img src="{{ f.img }}" alt="{{ f.name }}の鑑定" style="width:{{ feeImgW }};flex:none;aspect-ratio:{{ feeImgAR }};object-fit:cover;display:block"></sc-if>
          <sc-if value="{{ f.noImg }}" hint-placeholder-val="{{ true }}"><div style="width:100%;aspect-ratio:4/3;background:repeating-linear-gradient(135deg,#ece2d2 0 10px,#e6dac7 10px 20px);display:grid;place-items:center;font-family:monospace;font-size:12px;color:#6b5a52">{{ f.name }}の写真</div></sc-if>
          <div style="padding:{{ feePad }};display:flex;flex-direction:column;gap:{{ feeGap }};flex:1;min-width:0">
          <h3 style="margin:0;font-family:'Shippori Mincho',serif;font-weight:500;font-size:{{ feeH3 }};letter-spacing:.08em">{{ f.name }}<span style="font-size:15px;letter-spacing:.04em;color:#6b5a52">（{{ f.time }}）</span></h3>
          <div style="font-family:'Shippori Mincho',serif;font-size:19px;color:#651d26">{{ f.price }}</div>
          <button onClick="{{ f.consult }}" style="margin-top:auto;background:none;border:1px solid #651d26;color:#651d26;padding:13px 16px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;white-space:nowrap;flex:none" style-hover="background:#651d26;color:#fff">この鑑定で相談する</button>
          </div>
        </div>
      </sc-for>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap">
      <span style="font-size:12px;color:#8a7a70">デモ用参考料金。現行料金・税込区分、延長料金・追加費用は確認中です。</span>
      <a href="#" onClick="{{ go.services }}" style="border-bottom:1px solid #651d26;padding:10px 0;font-size:14px;display:flex;gap:28px;white-space:nowrap;flex:none">すべての鑑定と料金を見る</a>
    </div>
  </div>
</section>

<section style="max-width:1320px;margin:0 auto;padding:clamp(64px,9vw,128px) clamp(20px,5vw,56px);display:flex;gap:clamp(40px,6vw,96px);align-items:flex-start;flex-wrap:wrap-reverse">
  <div style="flex:1 1 380px;display:flex;flex-direction:column;gap:28px;align-self:stretch">
    <div style="display:flex;align-items:center;gap:12px;font-family:'Shippori Mincho',serif;font-size:13px;letter-spacing:.16em;color:#651d26"><span style="width:24px;height:1px;background:#b8925a"></span>先生紹介</div>
    <h2 style="margin:0;font-family:'Shippori Mincho',serif;font-weight:500;font-size:clamp(26px,3.2vw,38px);line-height:1.6;letter-spacing:.06em">ご自身の力を、<br>生かすために。</h2>
    <div style="display:flex;flex-direction:column;gap:20px">
    <div style="display:flex;align-items:baseline;gap:16px;border-top:1px solid #e2d8c9;padding-top:24px"><span style="font-family:'Shippori Mincho',serif;font-size:28px;letter-spacing:.2em">鄭 東秀</span><span style="font-size:12px;color:#6b5a52;letter-spacing:.2em">チョン ドンス</span></div>
    <p style="margin:0;font-size:15px;line-height:2.1;color:#4a3b35">韓国の公州市、鶏龍山に生まれ、祖父のもとで修行を重ねる。1992年に龍門精舎を継承。</p>
    <p style="margin:0;font-size:15px;line-height:2.1;color:#4a3b35">占いや祈祷を通して、一人ひとりが自身の力を生かすための相談に向き合っています。</p>
    <span style="font-size:12px;color:#8a7a70">経歴は既存の自己紹介に基づく参考情報です。</span>
    </div>
    <a href="#" onClick="{{ go.teachers }}" style="align-self:flex-start;margin-top:auto;border-bottom:1px solid #651d26;padding:10px 0;font-size:14px;display:flex;gap:28px;white-space:nowrap;flex:none">先生紹介を見る</a>
  </div>
  <figure style="margin:0;flex:1 1 340px;max-width:480px;position:relative">
    <img src="uploads/pasted-1792502151846-0.png" alt="相談者に向き合う鄭東秀先生" style="width:100%;aspect-ratio:4/5;object-fit:cover;object-position:84% center;display:block">
    <figcaption style="position:absolute;left:-14px;bottom:-14px;background:#651d26;color:#f3ece0;padding:14px 20px;font-family:'Shippori Mincho',serif;font-size:14px;letter-spacing:.3em">人と向き合う</figcaption>
  </figure>
</section>

<section style="background:#2a0f14;color:#f3ece0;position:relative;overflow:hidden">
  <div style="position:absolute;right:-2vw;top:-4vw;font-family:'Shippori Mincho',serif;font-size:min(36vw,460px);line-height:1;color:rgba(184,146,90,.06)">祈</div>
  <div style="position:relative;max-width:1320px;margin:0 auto;padding:clamp(64px,9vw,128px) clamp(20px,5vw,56px);display:flex;flex-direction:column;gap:40px">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap">
      <div style="display:flex;flex-direction:column;gap:20px">
        <div style="display:flex;align-items:center;gap:12px;font-family:'Shippori Mincho',serif;font-size:13px;letter-spacing:.16em;color:#d4b07c"><span style="width:24px;height:1px;background:#b8925a"></span>祈祷とお札</div>
        <h2 style="margin:0;font-family:'Shippori Mincho',serif;font-weight:500;font-size:clamp(26px,3.2vw,38px);line-height:1.6;letter-spacing:.06em">願いに向き合い、<br>祈りを込めて。</h2>
      </div>
      <p style="margin:0;max-width:400px;font-size:14px;line-height:2;color:#d9cbb6">祈祷の場から、一枚の霊符へ。<br>ご希望を伺い、内容に応じた方法をご案内します。</p>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(24px,4vw,48px)">
      <article style="display:flex;flex-direction:column;gap:24px">
        <img src="assets/prayer.webp" alt="祭壇の前で祭具を持ち、祈祷を行う先生" style="width:100%;aspect-ratio:3/2;object-fit:cover;display:block">
        <div style="display:flex;flex-direction:column;gap:16px;flex:1">
        <h3 style="margin:0;font-family:'Shippori Mincho',serif;font-weight:500;font-size:24px;line-height:1.6">祈祷<span style="display:block;margin-top:6px;font-size:15px;letter-spacing:.04em;color:#d9cbb6">祈りを捧げる静かな時間。</span></h3>

const EMPTY_FORM = {type:'',name:'',email:'',service:'',teacher:'指定なし・相談したい',store:'指定なし・相談したい',date:'',message:'',agree:false};

class Component extends DCLogic {
  state = { picker:null, picks:{}, slide:0, page:'top', w: 1280, menu:false, faq:0, cat:'all', cart:{}, cartOpen:false, added:null, form:{...EMPTY_FORM}, err:{}, sent:false };

  componentDidMount() {
    this.onResize = () => this.setState({ w: window.innerWidth });
    this.onHash = () => { const p = location.hash.replace('#',''); if (PAGES.includes(p) && p !== this.state.page) this.setState({ page:p }); };
    window.addEventListener('resize', this.onResize);
    window.addEventListener('hashchange', this.onHash);
    this.onScroll = () => { const past = window.scrollY > 560; if (past !== this.state.past) this.setState({ past }); };
    window.addEventListener('scroll', this.onScroll, { passive:true });
    this.onResize(); this.onHash();
    this.startSlides();
    setTimeout(() => this.updCar(), 300);
  }
  carRef = React.createRef();
  carMove(d) { const el = this.carRef.current; if (!el) return; const card = el.firstElementChild; const step = card ? card.getBoundingClientRect().width + 20 : 300; el.scrollBy({ left: d * step, behavior:'smooth' }); }
  updCar() { const el = this.carRef.current; if (!el) return; const max = el.scrollWidth; const w = Math.min(100, el.clientWidth / max * 100); const l = el.scrollLeft / max * 100; this.setState({ carBar:{ left: l + '%', width: w + '%' } }); }
  startSlides() { clearInterval(this.slideT); this.slideT = setInterval(() => this.setState(s => ({ slide:(s.slide+1)%SLIDES.length })), 6500); }
  componentWillUnmount() {
    clearInterval(this.slideT);
    window.removeEventListener('resize', this.onResize);
    window.removeEventListener('hashchange', this.onHash);
    window.removeEventListener('scroll', this.onScroll);
  }
  go(page, formPatch) {
    const s = { page, menu:false, cartOpen:false };
    if (formPatch) Object.assign(s, { form:{...this.state.form, ...formPatch}, sent:false, err:{} });
    this.setState(s);
    try { history.replaceState(null, '', page === 'top' ? location.pathname + location.search : '#' + page); } catch(e) {}
    window.scrollTo(0, 0);
  }
  link(page, patch) { return e => { if (e && e.preventDefault) e.preventDefault(); this.go(page, patch); }; }
  addToCart(id) {
    this.setState(s => ({ cart:{...s.cart, [id]:(s.cart[id]||0)+1}, added:id }));
    clearTimeout(this.addT); this.addT = setTimeout(() => this.setState({ added:null }), 1400);
  }
  setQty(id, d) {
    this.setState(s => { const c = {...s.cart}; c[id] = (c[id]||0) + d; if (c[id] <= 0) delete c[id]; return { cart:c }; });
  }
  submit(e) {
    e.preventDefault();
    const f = this.state.form, err = {};
    if (!f.type) err.type = 'お問い合わせの種類を選択してください。';
    if (!f.name.trim()) err.name = 'お名前を入力してください。';
    if (!/^\S+@\S+\.\S+$/.test(f.email)) err.email = 'メールアドレスの形式をご確認ください。';
    if (!f.message.trim()) err.message = 'ご相談内容を入力してください。';
    if (!f.agree) err.agree = '同意が必要です。';
    this.setState({ err, sent: Object.keys(err).length === 0 });
    window.scrollTo(0, 0);
  }

  renderVals() {
    const { page, w, menu, faq, cat, cart, cartOpen, added, form, err, sent } = this.state;
    const narrow = w < 1200, mobile = w < 760;
    const go = {}; PAGES.forEach(p => go[p] = this.link(p));
    const is = {}; PAGES.forEach(p => is[p] = page === p);
    const on = {};
    Object.keys(EMPTY_FORM).forEach(k => on[k] = e => { const v = k === 'agree' ? e.target.checked : e.target.value; this.setState(s => ({ form:{...s.form, [k]:v} })); });
    const cartIds = Object.keys(cart);
    const cartItems = cartIds.map(id => { const p = ITEMS[id]; return { name:p.name, img:p.img, noImg:!p.img, glyph1:p.glyph[0], qty:cart[id], sub:yen(p.price*cart[id]), inc:() => this.setQty(id,1), dec:() => this.setQty(id,-1) }; });
    const list = PRODUCTS.filter(p => cat === 'all' || p.cat === cat);
    const cardOf = p => ({ ...p, isFu: !p.img, img: p.img || '', fit: p.variants ? 'contain' : 'cover', pad: p.variants ? '14%' : '0', consultReq: !!p.consult, catLabel: CAT_LABEL[p.cat], priceLabel: priceRange(p),
      tileBg: p.cat === 'goods' ? '#e7dccb' : '#ece2d2', countLabel: p.variants ? p.variants.length + '種類' : '',
      add: () => this.setState({ picker: p.id, picks: (p.variants && p.variants.length > 1) ? {} : { [(p.variants ? p.variants[0].id : p.id)]: 1 } }),
      btnLabel: added === p.id ? '追加しました ✓' : ((p.variants && p.variants.length > 1) ? '種類を選んでカートへ' : '枚数を選んでカートへ'),
      btnBg: added === p.id ? '#651d26' : 'transparent', btnFg: added === p.id ? '#fff' : '#651d26' });
    const pk = PRODUCTS.find(p => p.id === this.state.picker);
    const pkVars = pk ? (pk.variants || [{ id: pk.id, name: pk.name, price: pk.price, img: pk.img, glyph: pk.glyph }]) : [];
    const picks = this.state.picks || {};
    const pickIds = Object.keys(picks);
    const pickTotalQty = pickIds.reduce((a,id) => a + picks[id], 0);
    const consult = (service, extra) => this.link('contact', { service, type:'鑑定のご予約', ...(extra||{}) });
    const feeMap = f => ({ ...f, img: f.img || '', noImg: !f.img, consult: consult(f.name) });
    return {
      headH: mobile ? '64px' : '76px', headGap: mobile ? '10px' : '24px',
      feeDir: mobile ? 'row' : 'column', feeImgW: mobile ? '36%' : '100%', feeImgAR: mobile ? '1/1' : '4/3',
      feePad: mobile ? '16px' : '28px', feeGap: mobile ? '8px' : '18px', feeH3: mobile ? '21px' : '26px',
      concernMin: mobile ? '140px' : '240px', concernGap: mobile ? '10px' : '16px', concernPad: mobile ? '18px 16px' : '24px',
      subH1: mobile ? 'clamp(26px,7.2vw,34px)' : 'clamp(32px,4.4vw,56px)',
      teacherMin: mobile ? '140px' : '220px', teacherGap: mobile ? '28px 14px' : '24px',
      prodMin: mobile ? '140px' : '240px', prodGap: mobile ? '28px 12px' : 'clamp(20px,3vw,36px) 24px', prodH3: mobile ? '16px' : '18px', prodDesc: mobile ? '12px' : '13px',
      prodPrice: mobile ? '15px' : '20px', prodTaxDisp: mobile ? 'block' : 'inline', prodTaxML: mobile ? '-1em' : '0', prodBtnW: mobile ? '100%' : 'auto',
      pickPad: mobile ? '16px' : '24px 28px', pickMin: mobile ? '130px' : '150px', pickGap: mobile ? '10px' : '14px', pickHeadPad: mobile ? '18px 16px' : '24px 28px', pickBtnW: mobile ? '100%' : 'auto',
      mobileCta: mobile && !this.state.picker && (page !== 'top' || this.state.past) && page !== 'contact' && !menu && !cartOpen,
      wide: !narrow, narrow, menuOpen: narrow && menu, menuLabel: menu ? 'メニューを閉じる' : 'メニューを開く',
      hb: menu ? {t1:'21px',t3:'21px',r1:'rotate(45deg)',r3:'rotate(-45deg)',o:0} : {t1:'14px',t3:'28px',r1:'none',r3:'none',o:1},
      toggleMenu: () => this.setState({ menu: !menu }),
      toggleCart: () => this.setState({ cartOpen: !cartOpen, menu:false }),
      nav: NAV.map(([k,l]) => ({ label:l, go:go[k], active: page === k, isShop: k === 'shop' })),
      go, is, isSub: page !== 'top', sub: SUB[page] || SUB.about,
      showCta: page !== 'contact',
      heroCaption: !narrow,
      slides: SLIDES.map((s,i) => ({ ...s, op: i === this.state.slide ? 1 : 0, tf: i === this.state.slide ? 'scale(1)' : 'scale(1.08)', bar: i === this.state.slide ? '#d4b07c' : 'rgba(243,236,224,.3)', label:'スライド'+(i+1), pick: () => { this.setState({ slide:i }); this.startSlides(); } })),
      slideNo: String(this.state.slide+1).padStart(2,'0') + ' / ' + String(SLIDES.length).padStart(2,'0'),
      heroImgW: mobile ? '100%' : 'min(60%, 820px)',
      heroOverlay: mobile
        ? 'linear-gradient(180deg, rgba(27,11,14,.55) 0%, rgba(27,11,14,.8) 55%, #1b0b0e 100%)'
        : 'linear-gradient(90deg, #1b0b0e 36%, rgba(27,11,14,.7) 52%, rgba(27,11,14,.05) 78%), linear-gradient(0deg, rgba(27,11,14,.7), transparent 30%)',
      concerns: CONCERNS, steps: STEPS, timeline: TIMELINE,
      feesTop: FEES.slice(0,4).map(feeMap), fees: FEES.map(feeMap),
      teachers: TEACHERS.map(t => ({ ...t, noImg: !t.img, consult: this.link('contact', { teacher:t.name, type:'鑑定のご予約' }) })),
      teacherMain: this.link('contact', { teacher:'鄭 東秀 先生', type:'鑑定のご予約' }),
      prayerConsult: this.link('contact', { service:'祈祷とグッズ', type:'祈祷・グッズについて' }),
      storeShinjuku: this.link('contact', { store:'新宿本店' }),
      storeOkubo: this.link('contact', { store:'新大久保イケメン通り店' }),
      faq: FAQ.map((q,i) => ({ ...q, open: faq === i, icon: faq === i ? '−' : '＋', toggle: () => this.setState({ faq: faq === i ? -1 : i }) })),
      shopTeaser: PRODUCTS.map(cardOf),
      pickerOpen: !!pk, pickerTitle: pk ? pk.name : '', pickerDesc: pk ? pk.desc : '', pickerRange: pk ? priceRange(pk) : '',
      pickerDescShow: !!pk,
      pickerEyebrow: pk && pk.variants && pk.variants.length > 1 ? '種類と枚数を選ぶ（複数選択可）' : '枚数を選ぶ',
      pickerItems: pkVars.map(v => { const q = picks[v.id] || 0; return { ...v, img: v.img || '', noImg: !v.img, glyph: v.glyph || '守', priceLabel: yen(v.price), qty: q, sel: q > 0, border: q > 0 ? '#651d26' : '#e2d8c9', bg: q > 0 ? '#f3e6e2' : '#fbf8f2',
        choose: () => this.setState(s => { const n = { ...(s.picks||{}) }; if (n[v.id]) delete n[v.id]; else n[v.id] = 1; return { picks: n }; }),
        inc: () => this.setState(s => ({ picks: { ...(s.picks||{}), [v.id]: ((s.picks||{})[v.id]||0) + 1 } })),
        dec: () => this.setState(s => { const n = { ...(s.picks||{}) }; n[v.id] = (n[v.id]||0) - 1; if (n[v.id] <= 0) delete n[v.id]; return { picks: n }; }) }; }),
      pickerReady: pickTotalQty > 0, pickerNotReady: pickTotalQty === 0,
      pickerSelLabel: pickTotalQty > 0 ? '選択中：' + pickIds.length + '種類・' + pickTotalQty + '枚　合計 ' + yen(pickIds.reduce((a,id) => a + ITEMS[id].price * picks[id], 0)) : '種類を選択してください',
      closePicker: () => this.setState({ picker: null, picks: {} }),
      confirmPick: () => { const pid = this.state.picker, pk2 = this.state.picks || {}; if (!Object.keys(pk2).length) return; this.setState(s => { const c = { ...s.cart }; Object.keys(pk2).forEach(id => c[id] = (c[id]||0) + pk2[id]); return { cart: c, picker: null, picks: {}, added: pid, cartOpen: true }; }); clearTimeout(this.addT); this.addT = setTimeout(() => this.setState({ added: null }), 1400); },
      carRef: this.carRef,
      carScroll: () => this.updCar(),
      carPrev: () => this.carMove(-1), carNext: () => this.carMove(1),
      carBar: this.state.carBar || { left:'0%', width:'40%' },
      cats: CATS.map(([k,l]) => ({ label:l, pick: () => this.setState({ cat:k }), bg: cat === k ? '#651d26' : 'transparent', fg: cat === k ? '#fff' : '#2b1d1a', border: cat === k ? '#651d26' : '#d6c9b5' })),
      productCountLabel: list.length + '点の商品',
      products: list.map(cardOf),
      cartOpen, cartItems, cartEmpty: cartIds.length === 0,
      cartCount: cartIds.reduce((a,id) => a + cart[id], 0),
      cartTotal: yen(cartIds.reduce((a,id) => a + ITEMS[id].price*cart[id], 0)),
      form, on, err, sent, notSent: !sent,
      submit: e => this.submit(e),
      backToForm: () => this.setState({ sent:false }),
      summary: [['お問い合わせの種類',form.type],['お名前',form.name],['メールアドレス',form.email],['ご希望の鑑定・内容',form.service||'—'],['ご希望の先生',form.teacher],['ご希望の店舗',form.store],['ご希望の日時',form.date||'—'],['ご相談内容',form.message]].map(([k,v]) => ({k,v})),
    };
  }
}
</script>
</body>
</html>
